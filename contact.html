<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Oday AbuBaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script> 
</head>
<body>

    <main class="container" style="max-width: 550px; margin-top: 40px; margin-bottom: 40px;">
        <span class="badge" style="display: block; text-align: center; margin: 0 auto 15px auto; width: fit-content;">Get In Touch</span>
        <h1 style="text-align: center; margin-bottom: 25px;"><i class="fa-regular fa-paper-plane"></i> Contact Me</h1>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="fullName"><i class="fa-regular fa-user"></i> Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="country"><i class="fa-solid fa-globe"></i> Country</label>
                <select id="country" name="country" required>
                    <option value="" disabled selected>Select your country</option>
                    <option value="Jordan">Jordan</option>
                    <option value="Saudi Arabia">Saudi Arabia</option>
                    <option value="UAE">UAE</option>
                    <option value="Egypt">Egypt</option>
                    <option value="Palestine">Palestine</option>
                    <option value="Qatar">Qatar</option>
                    <option value="Kuwait">Kuwait</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="comments"><i class="fa-regular fa-comment-dots"></i> Comments / Message</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Write your message here..." required></textarea>
            </div>
            
            <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
        </form>
        <div id="successMessage" style="display: none; text-align: center; padding: 25px 10px;">
            <div style="font-size: 3rem; margin-bottom: 10px; color: var(--primary-color);">
                <i class="fa-circle-check fa-regular"></i>
            </div>
            <h3 style="color: var(--primary-color); margin-bottom: 10px; font-size: 1.5rem;">Message Sent!</h3>
            <p style="color: var(--text-muted);">Thank you for reaching out, Oday will get back to you as soon as possible.</p>
        </div>
        <div style="margin-top: 35px; padding-top: 25px; border-top: 1px solid var(--glass-border); display: flex; justify-content: center; width: 100%;">
            <div class="nav-links" style="display: flex; justify-content: center;">
                <a href="index.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
            </div>
        </div>

    </main>

</body>
</html>
